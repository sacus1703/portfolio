    <!-- Favicon (opcional — crie um favicon.svg em /public) -->
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />

    <!-- Anti-flash: aplica o tema salvo ANTES do React renderizar -->
    <script>
      (function () {
        try {
          const salvo = localStorage.getItem("tema");
          const prefereEscuro = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          const tema = salvo || (prefereEscuro ? "escuro" : "claro");
          document.documentElement.setAttribute("data-tema", tema);
        } catch (e) {
          // Se localStorage falhar, mantém o padrão "claro"
        }
      })();
    </script>
